name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (plain files or an uploaded zip)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            unzip -q -o "$ZIP" -d unpacked
            DIR=$(dirname "$(find unpacked -maxdepth 3 -name gradlew | head -n 1)")
          else
            DIR=.
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run engine tests and build the APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :engine:test :app:assembleDebug

      - name: Publish a release with the APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PokerCoach.apk
          gh release create "build-${{ github.run_number }}.${{ github.run_attempt }}" PokerCoach.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PokerCoach build ${{ github.run_number }}" \
            --notes "Open this page on your phone and tap PokerCoach.apk to install." \
            --latest
